<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:opsz,wght@9..40,600;9..40,800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1350px;overflow:hidden}
body{background:radial-gradient(90% 45% at 50% -5%,rgba(255,107,26,.55),transparent 65%),radial-gradient(60% 40% at 100% 100%,rgba(255,46,99,.28),transparent 60%),radial-gradient(60% 40% at 0% 90%,rgba(255,194,61,.14),transparent 60%),linear-gradient(180deg,#24140d,#120a07 70%);font-family:"DM Sans";color:#fff4e6;position:relative}
body::after{content:'';position:absolute;inset:0;background-image:radial-gradient(rgba(255,244,230,.08) 1.5px,transparent 1.5px);background-size:22px 22px;mask-image:linear-gradient(180deg,#000,transparent 50%)}
.top{position:absolute;left:0;right:0;top:26px;text-align:center;z-index:2}
.top h1{font:400 58px/1 Anton;letter-spacing:.01em}
.top h1 span{background:linear-gradient(180deg,#ffc23d,#ff6b1a);-webkit-background-clip:text;background-clip:text;color:transparent}
.phone{position:absolute;left:209px;top:104px;width:662px;height:1170px;border-radius:58px;background:#2a1d17;box-shadow:0 0 0 2px rgba(255,255,255,.07),0 50px 90px -30px rgba(0,0,0,.9)}
.bottom{position:absolute;left:0;right:0;bottom:22px;text-align:center;z-index:2}
.bottom b{display:inline-block;font:800 26px "DM Sans";color:#1a0d06;background:#fff4e6;border-radius:999px;padding:10px 26px}
.side{position:absolute;top:560px;font:400 34px/1.05 Anton;color:rgba(255,244,230,.22);writing-mode:vertical-rl;letter-spacing:.12em}
.l{left:70px;transform:rotate(180deg)} .r{right:70px}
</style></head><body>
<div class="top"><h1>PASS THE <span>MIC</span></h1></div>
<div class="side l">WHEN THE MUSIC STOPS</div><div class="side r">YOU SING THE NEXT LINE</div>
<div class="phone"></div>
<div class="bottom"><b>pass-the-mic.vercel.app</b></div>
</body></html>
